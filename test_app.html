<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فهمني القرآن</title>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #1B5E20;
    --primary-dark: #0D3B0E;
    --primary-light: #2E7D32;
    --gold: #D4AF37;
    --gold-light: #F0D060;
    --cream: #FFF8F0;
    --dark-bg: #121212;
    --dark-card: #1E1E1E;
    --text-dark: #1A1A2E;
    --text-light: #FFFFFF;
    --shadow: 0 4px 20px rgba(27, 94, 32, 0.15);
    --radius: 16px;
    --transition: all 0.3s ease;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Noto Naskh Arabic', serif;
    background: var(--cream);
    color: var(--text-dark);
    direction: rtl;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  html {
    width: 100%;
    overflow-x: hidden;
  }

  /* Dark Mode */
  body.dark-mode {
    background: var(--dark-bg);
    color: #e0e0e0;
  }

  body.dark-mode .surah-card {
    background: var(--dark-card);
    border-color: rgba(212, 175, 55, 0.2);
  }

  body.dark-mode .surah-card .surah-name {
    color: #e0e0e0;
  }

  body.dark-mode .player-bar {
    background: linear-gradient(135deg, #0D3B0E, #1a1a1a);
  }

  body.dark-mode .file-item {
    background: var(--dark-card);
  }

  body.dark-mode .file-item .file-name {
    color: #e0e0e0;
  }

  body.dark-mode .search-box {
    background: var(--dark-card);
    color: #e0e0e0;
  }

  body.dark-mode .search-box::placeholder {
    color: #888;
  }

  body.dark-mode .splash-screen {
    background: linear-gradient(135deg, #0D3B0E, #1a1a1a);
  }

  body.dark-mode .splash-screen .subtitle {
    color: #F0D060;
  }

  body.dark-mode .settings-section {
    background: var(--dark-card);
  }

  body.dark-mode .settings-section label {
    color: #e0e0e0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar {
    width: 6px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--gold);
    border-radius: 3px;
  }

  /* Splash Screen */
  .splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .splash-screen.hidden {
    opacity: 0;
    transform: scale(1.1);
    pointer-events: none;
  }

  .splash-icon {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
    box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(212, 175, 55, 0.3); }
    50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(212, 175, 55, 0.5); }
  }

  .splash-icon svg {
    width: 60px;
    height: 60px;
    fill: var(--gold);
  }

  .splash-title {
    font-size: 36px;
    font-weight: 700;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }

  .splash-subtitle {
    font-size: 16px;
    color: var(--gold-light);
    margin-bottom: 60px;
  }

  .splash-loader {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* App Container */
  .app-container {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding-bottom: 80px;
    opacity: 0;
    transition: opacity 0.5s ease;
    min-height: 100vh;
    overflow-y: auto;
  }

  .app-container.show {
    opacity: 1;
  }

  /* App Bar */
  .app-bar {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 16px 20px;
    color: white;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(27, 94, 32, 0.3);
  }

  .app-bar-content {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .app-bar-title {
    font-size: 20px;
    font-weight: 700;
  }

  .app-bar-actions {
    display: flex;
    gap: 8px;
  }

  .app-bar-btn {
    background: none;
    border: none;
    color: var(--gold);
    font-size: 22px;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .app-bar-btn:hover {
    background: rgba(255,255,255,0.1);
  }

  /* Search */
  .search-container {
    padding: 12px 16px;
    display: none;
  }

  .search-container.show {
    display: block;
    animation: slideDown 0.3s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .search-box {
    width: 100%;
    padding: 12px 20px;
    border: 2px solid rgba(212, 175, 55, 0.3);
    border-radius: 30px;
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 15px;
    background: white;
    color: var(--text-dark);
    outline: none;
    transition: var(--transition);
  }

  .search-box:focus {
    border-color: var(--gold);
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
  }

  /* Header */
  .header {
    padding: 16px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--primary);
  }

  .header h2 {
    font-size: 14px;
    font-weight: 500;
  }

  .header .count {
    font-size: 12px;
    color: var(--gold);
  }

  /* Surah Grid */
  .surah-grid {
    padding: 8px 12px 100px;
  }

  /* Surah Card */
  .surah-card {
    background: white;
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow);
  }

  .surah-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(27, 94, 32, 0.2);
    border-color: var(--gold);
  }

  .surah-card:active {
    transform: scale(0.98);
  }

  .surah-number {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(27, 94, 32, 0.3);
  }

  .surah-info {
    flex: 1;
  }

  .surah-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
  }

  .surah-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #888;
  }

  .surah-meta svg {
    width: 14px;
    height: 14px;
    fill: var(--gold);
  }

  .surah-arrow {
    width: 36px;
    height: 36px;
    background: rgba(212, 175, 55, 0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 16px;
    flex-shrink: 0;
  }

  /* Back Button */
  .back-btn {
    background: var(--primary);
    border: none;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 8px 20px;
    border-radius: 10px;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Noto Naskh Arabic', serif;
  }

  .back-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }

  .back-btn::before {
    content: '\2039';
    font-size: 20px;
    line-height: 1;
  }

  /* Surah Detail Header */
  .surah-detail-header {
    margin: 12px;
    padding: 24px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 20px;
    text-align: center;
    color: white;
    box-shadow: 0 8px 30px rgba(27, 94, 32, 0.3);
  }

  .surah-detail-header .icon {
    font-size: 40px;
    margin-bottom: 10px;
  }

  .surah-detail-header .name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .surah-detail-header .files-count {
    display: inline-block;
    padding: 4px 16px;
    background: rgba(212, 175, 55, 0.2);
    border-radius: 20px;
    font-size: 13px;
    color: var(--gold-light);
  }

  /* Files List */
  .files-list {
    padding: 8px 12px 100px;
  }

  .file-item {
    background: white;
    border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 14px;
    padding: 10px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
    transition: var(--transition);
  }

  .file-item:hover {
    border-color: var(--gold);
    transform: translateX(-3px);
  }

  .file-item.active {
    border-color: var(--gold);
    border-width: 2px;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
  }

  .file-index {
    width: 32px;
    height: 32px;
    background: rgba(27, 94, 32, 0.1);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    flex-shrink: 0;
  }

  .file-item.active .file-index {
    background: var(--primary);
    color: white;
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-dark);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-item.active .file-name {
    font-weight: 700;
    color: var(--primary);
  }

  .file-play-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(212, 175, 55, 0.12);
    color: var(--primary);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
    margin: 0 4px;
  }

  .file-play-btn:hover {
    background: var(--primary);
    color: var(--gold);
  }

  .file-item.active .file-play-btn {
    background: var(--primary);
    color: var(--gold);
  }

  /* Player Bar */
  .player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 800px;
    margin: 0 auto;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 10px 16px;
    display: none;
    z-index: 200;
    box-shadow: 0 -8px 30px rgba(27, 94, 32, 0.4);
  }

  .player-bar.show {
    display: block;
  }

  .player-bar-inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }

  .player-bar-start {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    cursor: pointer;
    justify-self: start;
  }

  .player-bar-play-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: var(--gold);
    color: var(--primary);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    justify-self: center;
  }

  .player-bar-play-btn:hover {
    transform: scale(1.05);
  }

  .player-bar-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .player-bar-file {
    font-size: 13px;
    font-weight: 700;
    color: white;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-bar-surah {
    font-size: 11px;
    color: var(--gold-light);
  }

  .player-bar-progress {
    width: 50px;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: flex;
    flex-shrink: 0;
  }

  .player-bar-progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    width: 0%;
    transition: width 0.5s linear;
  }

  .player-bar-next {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    padding: 4px;
    justify-self: end;
  }

  /* Full Player */
  .full-player-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 800px;
    margin: 0 auto;
    background: var(--cream);
    z-index: 300;
    display: none;
    flex-direction: column;
    direction: rtl;
  }

  body.dark-mode .full-player-overlay {
    background: var(--dark-bg);
  }

  .full-player-overlay.show {
    display: flex;
  }

  .full-player-header {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .full-player-header button {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 18px;
    cursor: pointer;
    padding: 8px;
    font-family: 'Noto Naskh Arabic', serif;
  }

  .full-player-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .player-art {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 30px;
    box-shadow: 0 0 50px rgba(27, 94, 32, 0.3);
    transition: transform 0.3s ease;
  }

  .player-art.playing {
    animation: rotate 20s linear infinite;
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .player-art svg {
    width: 70px;
    height: 70px;
    fill: var(--gold);
  }

  .player-file-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    text-align: center;
    margin-bottom: 8px;
  }

  .player-surah-name {
    font-size: 14px;
    color: var(--gold);
    margin-bottom: 30px;
  }

  .player-progress-container {
    width: 100%;
    max-width: 400px;
    margin-bottom: 30px;
  }

  .player-time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
  }

  .player-progress-bar {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(27, 94, 32, 0.15);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }

  .player-progress-bar::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    background: var(--gold);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 30px;
  }

  .player-control-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: rgba(27, 94, 32, 0.1);
    color: var(--primary);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
  }

  .player-control-btn:hover {
    background: rgba(27, 94, 32, 0.2);
  }

  .player-main-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: var(--gold);
    font-size: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 30px rgba(27, 94, 32, 0.3);
    transition: var(--transition);
  }

  .player-main-btn:hover {
    transform: scale(1.05);
  }

  .player-fav-btn {
    background: none;
    border: 2px solid rgba(212, 175, 55, 0.4);
    border-radius: 30px;
    padding: 10px 24px;
    color: var(--gold);
    font-family: 'Noto Naskh Arabic', serif;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
  }

  .player-fav-btn:hover {
    border-color: var(--gold);
    background: rgba(212, 175, 55, 0.1);
  }

  /* Playlist Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 400;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }



  .modal-overlay.show {
    display: flex;
  }

  .modal-content {
    background: var(--cream);
    width: 100%;
    max-width: 800px;
    max-height: 60vh;
    border-radius: 20px 20px 0 0;
    padding: 16px;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }

  body.dark-mode .modal-content {
    background: var(--dark-card);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: #ccc;
    border-radius: 2px;
    margin: 0 auto 16px;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
  }

  /* Settings */
  .settings-page {
    padding: 16px;
    padding-bottom: 100px;
  }

  .settings-section {
    background: white;
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  .settings-section h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid rgba(212, 175, 55, 0.1);
  }

  .settings-row:last-child {
    border-bottom: none;
  }

  .settings-row label {
    font-size: 15px;
    color: var(--text-dark);
  }

  .settings-row small {
    display: block;
    font-size: 11px;
    color: #888;
    margin-top: 2px;
  }

  /* Toggle Switch */
  .toggle {
    position: relative;
    width: 50px;
    height: 26px;
    background: #ccc;
    border-radius: 13px;
    cursor: pointer;
    transition: var(--transition);
  }

  .toggle.active {
    background: var(--primary);
  }

  .toggle::after {
    content: '';
    position: absolute;
    top: 3px;
    right: 3px;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    transition: var(--transition);
  }

  .toggle.active::after {
    right: 27px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 12px;
  }

  /* Page (for routing) */
  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  /* Favorites page */
  .fav-list {
    padding: 8px 12px 100px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
  }

  .empty-state svg {
    width: 80px;
    height: 80px;
    fill: rgba(212, 175, 55, 0.4);
    margin-bottom: 20px;
  }

  .empty-state h3 {

  /* Responsive */
  @media (max-width: 600px) {

</style>
</head>
<body>

<!-- Splash Screen -->
<div class="splash-screen" id="splash">
  <div class="splash-icon">
    <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
  </div>
  <div class="splash-title">فهمني القرآن</div>
  <div class="splash-subtitle">استمع إلى شرح القرآن الكريم</div>
  <div class="splash-loader"></div>
</div>

<!-- App Container -->
<div class="app-container" id="app">

  <!-- App Bar -->
  <div class="app-bar">
    <div class="app-bar-content">
      <div class="app-bar-title" id="appBarTitle">القرآن الكريم</div>
      <div class="app-bar-actions">
        <button class="app-bar-btn" onclick="toggleSearch()" title="بحث">&#128269;</button>
        <button class="app-bar-btn" onclick="showPage('favorites')" title="المفضلة">&#9829;</button>
        <button class="app-bar-btn" onclick="showPage('settings')" title="الإعدادات">&#9881;</button>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-container" id="searchContainer">
    <input class="search-box" id="searchBox" type="text" placeholder="ابحث عن سورة..." oninput="handleSearch(this.value)">
  </div>

  <!-- Pages -->
  <div class="page active" id="page-home">
    <div class="header">
      <h2>اختر سورة للاستماع</h2>
      <span class="count" id="surahCount"></span>
    </div>
    <div class="surah-grid" id="surahGrid"></div>
  </div>

  <div class="page" id="page-surah">
    <div id="surahDetailContainer"></div>
  </div>

  <div class="page" id="page-favorites">
    <div style="padding: 12px; padding-bottom: 0;">
      <button class="back-btn" onclick="showPage('home')" style="margin-bottom: 8px;">رجوع</button>
    </div>
    <div class="header">
      <h2>&#9829; المفضلة</h2>
    </div>
    <div class="fav-list" id="favList"></div>
  </div>

  <div class="page" id="page-settings">
    <div class="settings-page">
      <div style="padding: 12px;">
        <button class="back-btn" onclick="showPage('home')" style="margin-bottom: 8px;">رجوع</button>
      </div>
      <div class="settings-section">
        <h3><span>&#127912;</span> المظهر</h3>
        <div class="settings-row">
          <div>
            <label>الوضع الليلي</label>
            <small>تفعيل الألوان الداكنة</small>
          </div>
          <div class="toggle" id="darkModeToggle" onclick="toggleDarkMode()"></div>
        </div>
      </div>
      <div class="settings-section">
        <h3><span>&#8505;</span> عن التطبيق</h3>
        <div class="settings-row">
          <div>
            <label>فهمني القرآن</label>
            <small>استمع إلى شرح القرآن الكريم</small>
          </div>
        </div>
        <div class="settings-row">
          <div>
            <label>الإصدار</label>
          </div>
          <span style="color: var(--primary); font-weight: 700;">1.0.0</span>
        </div>
      </div>
      <div class="settings-section">
        <h3><span>&#128172;</span> الدعم</h3>
        <div class="settings-row">
          <label>تواصل معنا</label>
          <span style="font-size: 12px; color: #888;">support@fahemni-alquran.app</span>
        </div>
      </div>
      <div class="footer">جميع الحقوق محفوظة &copy; 2026</div>
    </div>
  </div>

</div>

<!-- Player Bar -->
<div class="player-bar" id="playerBar">
  <div class="player-bar-inner">
    <div class="player-bar-start" onclick="openFullPlayer()">
      <div class="player-bar-info">
        <div class="player-bar-file" id="playerBarFile">اسم الملف</div>
        <div class="player-bar-surah" id="playerBarSurah">اسم السورة</div>
      </div>
      <div class="player-bar-progress">
        <div class="player-bar-progress-fill" id="playerBarProgress"></div>
      </div>
    </div>
    <button class="player-bar-play-btn" id="playerBarBtn" onclick="event.stopPropagation(); togglePlayPause()">
      &#9654;
    </button>
    <button class="player-bar-next" onclick="event.stopPropagation(); playNext()">&#9197;</button>
  </div>
</div>

<!-- Full Player Overlay -->
<div class="full-player-overlay" id="fullPlayer">
  <div class="full-player-header">
    <button onclick="closeFullPlayer()">رجوع</button>
    <button onclick="showPlaylistModal()">&#9776; القائمة</button>
  </div>
  <div class="full-player-body">
    <div class="player-art" id="playerArt">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
    </div>
    <div class="player-file-name" id="fullPlayerFileName">اسم الملف</div>
    <div class="player-surah-name" id="fullPlayerSurahName">اسم السورة</div>
    <div class="player-progress-container">
      <div class="player-time-row">
        <span id="currentTime">00:00</span>
        <span id="totalTime">00:00</span>
      </div>
      <input class="player-progress-bar" id="progressBar" type="range" min="0" max="100" value="0" oninput="seekAudio(this.value)">
    </div>
    <div class="player-controls">
      <button class="player-control-btn" onclick="playPrevious()">&#9195;</button>
      <button class="player-main-btn" id="fullPlayerBtn" onclick="togglePlayPause()">&#9654;</button>
      <button class="player-control-btn" onclick="playNext()">&#9197;</button>
    </div>
    <button class="player-fav-btn" id="favBtn" onclick="toggleFavorite()">
      <span id="favIcon">&#9825;</span> <span id="favText">أضف إلى المفضلة</span>
    </button>
  </div>
</div>

<!-- Playlist Modal -->
<div class="modal-overlay" id="playlistModal">
  <div class="modal-content">
    <div class="modal-handle"></div>
    <div class="modal-title">قائمة التشغيل</div>
    <div id="playlistItems"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ App State ============
const state = {
  data: null,
  surahs: [],
  currentSurah: null,
  currentIndex: 0,
  currentFile: null,
  isPlaying: false,
  isDarkMode: false,
  favorites: JSON.parse(localStorage.getItem('favs') || '[]'),
  audioElement: null,
  isLoading: false,
  searchQuery: '',
};

// ============ Initialize ============
async function init() {
  try {
    // Show splash for at least 2 seconds
    const startTime = Date.now();

    // Load from GitHub data.json
    let data = null;
    const dataUrl = localStorage.getItem('data_url') || 'https://raw.githubusercontent.com/aslam2noor5/fahemni-alquran/master/data.json';

    try {
      const res = await fetch(dataUrl);
      if (res.ok) data = await res.json();
    } catch (e) {
      console.log('Could not fetch data.json, using demo data');
    }

    // If fetch failed, generate demo data
    if (!data) {
      data = generateDemoData();
    }

    state.data = data;
    state.surahs = data.surahs || [];

    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, 2000 - elapsed);

    setTimeout(() => {
      document.getElementById('splash').classList.add('hidden');
      document.getElementById('app').classList.add('show');
      renderSurahs();
      renderFavorites();
    }, remaining);

  } catch (e) {
    console.error('Init error:', e);
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('app').classList.add('show');
    renderSurahs();
  }
}

// ============ Demo Data Generator ============
function generateDemoData() {
  const surahNames = [
    '1 سورة الفاتحة', '2 سورة البقرة', '3 سورة آل عمران', '4 سورة النساء',
    '5 سورة المائدة', '6 سورة الأنعام', '7 سورة الأعراف', '8 سورة الأنفال',
    '9 سورة التوبة', '10 سورة يونس', '11 سورة هود', '12 سورة يوسف',
    '13 سورة الرعد', '14 سورة إبراهيم', '15 سورة الحجر', '16 سورة النحل',
    '17 سورة الإسراء', '18 سورة الكهف', '19 سورة مريم', '20 سورة طه',
    '21 سورة الأنبياء', '22 سورة الحج', '23 سورة المؤمنون', '24 سورة النور',
    '25 سورة الفرقان', '26 سورة الشعراء', '27 سورة النمل', '28 سورة القصص',
    '29 سورة العنكبوت', '30 سورة الروم', '31 سورة لقمان', '32 سورة السجدة',
    '33 سورة الأحزاب', '34 سورة سبأ', '35 سورة فاطر', '36 سورة يس',
    '37 سورة الصافات', '38 سورة ص', '39 سورة الزمر', '40 سورة غافر',
    '41 سورة فصلت', '42 سورة الشورى', '43 سورة الزخرف', '44 سورة الدخان',
    '45 سورة الجاثية', '46 جزء الأحقاف', '51 جزء الذاريات', '58 جزء قد سمع',
    '67 جزء تبارك', '78 جزء عم'
  ];

  // Load or create stored files data
  let storedFiles = {};
  try {
    storedFiles = JSON.parse(localStorage.getItem('surahFiles') || '{}');
  } catch(e) {}

  const surahs = surahNames.map((name, idx) => {
    // Generate demo audio files for each surah
    const fileCount = Math.floor(Math.random() * 5) + 1;
    const files = [];

    for (let i = 0; i < fileCount; i++) {
      const fileName = storedFiles[name] && storedFiles[name][i]
        ? storedFiles[name][i].name
        : `صفحة ${idx + 1} - ${name}`;

      const fileUrl = storedFiles[name] && storedFiles[name][i]
        ? storedFiles[name][i].url
        : 'https://example.com/audio.mp3';

      files.push({
        name: fileName,
        url: fileUrl,
        type: 'mp3'
      });
    }

    return { name, folder: name, files, count: files.length };
  });

  return { surahs, total_surahs: surahs.length, total_files: surahs.reduce((a,s) => a + s.count, 0) };
}

// ============ Render Surahs ============
function renderSurahs(filter = '') {
  const grid = document.getElementById('surahGrid');
  const count = document.getElementById('surahCount');

  let surahs = state.surahs;
  if (filter) {
    const q = filter.toLowerCase();
    surahs = surahs.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.files.some(f => f.name.toLowerCase().includes(q))
    );
  }

  count.textContent = `${surahs.length} سورة`;

  if (surahs.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <h3>لا توجد نتائج</h3>
        <p>لم يتم العثور على سور تطابق بحثك</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = surahs.map((surah, idx) => `
    <div class="surah-card" onclick="openSurah(${state.surahs.indexOf(surah)})" style="animation: slideDown 0.3s ease ${idx * 0.05}s both;">
      <div class="surah-number">${surah.name.split(' ')[0]}</div>
      <div class="surah-info">
        <div class="surah-name">${surah.name}</div>
        <div class="surah-meta">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7zm-1-11h2v6h-2zm0 8h2v2h-2z"/></svg>
          ${surah.count} ملف صوتي
        </div>
      </div>
      <div class="surah-arrow">&#8249;</div>
    </div>
  `).join('');
}

// ============ Open Surah ============
function openSurah(index) {
  const surah = state.surahs[index];
  state.currentSurah = surah;

  document.getElementById('appBarTitle').textContent = surah.name;
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-surah').classList.add('active');

  renderSurahFiles();
}

function renderSurahFiles() {
  const surah = state.currentSurah;
  if (!surah) return;

  const container = document.getElementById('surahDetailContainer');

  container.innerHTML = `
    <div style="padding: 12px;">
      <button class="back-btn" onclick="goHome()" style="margin-bottom: 8px;">رجوع</button>
      <div class="surah-detail-header">
        <div class="icon">&#128214;</div>
        <div class="name">${surah.name}</div>
        <div class="files-count">${surah.files.length} ملف صوتي</div>
      </div>
    </div>
    <div class="files-list" id="filesList">
      ${renderFileItems(surah.files)}
    </div>
  `;
}

function renderFileItems(files) {
  return files.map((file, idx) => {
    const isActive = state.currentFile &&
      state.currentSurah &&
      state.currentFile.url === file.url &&
      state.currentSurah.name === state.currentSurah?.name;

    return `
      <div class="file-item ${isActive ? 'active' : ''}" onclick="playFile(${idx})">
        <div class="file-index">${idx + 1}</div>
        <div class="file-info">
          <div class="file-name">${file.name}</div>
        </div>
        <button class="file-play-btn" onclick="event.stopPropagation(); playFile(${idx})">
          ${(isActive && state.isPlaying) ? '&#9646;&#9646;' : '&#9654;'}
        </button>
      </div>
    `;
  }).join('');
}

// ============ Audio Player ============
function playFile(index) {
  const surah = state.currentSurah;
  if (!surah || !surah.files[index]) return;

  state.currentFile = surah.files[index];
  state.currentIndex = index;
  state.currentSurah = surah;

  // Show player bar
  document.getElementById('playerBar').classList.add('show');
  updatePlayerUI();
  updateFileListUI();

  // Create/update audio element
  if (!state.audioElement) {
    state.audioElement = new Audio();
    state.audioElement.addEventListener('timeupdate', updateProgress);
    state.audioElement.addEventListener('ended', onAudioEnd);
    state.audioElement.addEventListener('loadedmetadata', () => {
      document.getElementById('totalTime').textContent = formatTime(state.audioElement.duration);
    });
  }

  state.audioElement.src = state.currentFile.url;
  state.audioElement.play().then(() => {
    state.isPlaying = true;
    updatePlayButtons();
  }).catch(e => {
    showToast('تعذر تشغيل الملف. تأكد من اتصالك بالإنترنت.');
    state.isPlaying = false;
    updatePlayButtons();
  });

  // Save last played
  try {
    localStorage.setItem('lastSurah', JSON.stringify({
      surahName: surah.name,
      fileIndex: index,
      fileName: state.currentFile.name
    }));
  } catch(e) {}
}

function togglePlayPause() {
  if (!state.audioElement || !state.currentFile) return;

  if (state.isPlaying) {
    state.audioElement.pause();
    state.isPlaying = false;
  } else {
    state.audioElement.play().catch(e => {
      showToast('تعذر التشغيل');
    });
    state.isPlaying = true;
  }
  updatePlayButtons();
}

function playNext() {
  const surah = state.currentSurah;
  if (!surah || state.currentIndex >= surah.files.length - 1) return;
  playFile(state.currentIndex + 1);
}

function playPrevious() {
  if (!state.currentFile) return;
  if (state.audioElement && state.audioElement.currentTime > 3) {
    state.audioElement.currentTime = 0;
    updateProgress();
  } else if (state.currentIndex > 0) {
    playFile(state.currentIndex - 1);
  }
}

function onAudioEnd() {
  const surah = state.currentSurah;
  if (surah && state.currentIndex < surah.files.length - 1) {
    playFile(state.currentIndex + 1);
  } else {
    state.isPlaying = false;
    updatePlayButtons();
  }
}

function seekAudio(value) {
  if (state.audioElement && state.audioElement.duration) {
    const time = (value / 100) * state.audioElement.duration;
    state.audioElement.currentTime = time;
  }
}

function updateProgress() {
  if (!state.audioElement) return;
  const current = state.audioElement.currentTime || 0;
  const duration = state.audioElement.duration || 1;
  const progress = (current / duration) * 100;

  document.getElementById('currentTime').textContent = formatTime(current);
  document.getElementById('playerBarProgress').style.width = `${progress}%`;
  document.getElementById('progressBar').value = progress;
}

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return '00:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updatePlayButtons() {
  const playIcon = state.isPlaying ? '&#9646;&#9646;' : '&#9654;';
  document.getElementById('playerBarBtn').innerHTML = playIcon;
  document.getElementById('fullPlayerBtn').innerHTML = playIcon;

  const art = document.getElementById('playerArt');
  if (state.isPlaying) {
    art.classList.add('playing');
  } else {
    art.classList.remove('playing');
  }

  updateFileListUI();
}

function updatePlayerUI() {
  if (state.currentFile) {
    document.getElementById('playerBarFile').textContent = state.currentFile.name;
    document.getElementById('playerBarSurah').textContent = state.currentSurah?.name || '';
    document.getElementById('fullPlayerFileName').textContent = state.currentFile.name;
    document.getElementById('fullPlayerSurahName').textContent = state.currentSurah?.name || '';
  }
  updateFavButton();
}

function updateFileListUI() {
  if (state.currentSurah) {
    const list = document.getElementById('filesList');
    if (list) {
      list.innerHTML = renderFileItems(state.currentSurah.files);
    }
  }
}

// ============ Full Player ============
function openFullPlayer() {
  document.getElementById('fullPlayer').classList.add('show');
  updatePlayerUI();
  updatePlayButtons();
  if (state.audioElement) {
    document.getElementById('totalTime').textContent = formatTime(state.audioElement.duration);
    updateProgress();
  }
}

function closeFullPlayer() {
  document.getElementById('fullPlayer').classList.remove('show');
}

function showPlaylistModal() {
  const surah = state.currentSurah;
  if (!surah) return;

  const modal = document.getElementById('playlistModal');
  const items = document.getElementById('playlistItems');

  items.innerHTML = surah.files.map((file, idx) => `
    <div class="file-item ${idx === state.currentIndex ? 'active' : ''}" onclick="playlistSelect(${idx})">
      <div class="file-index">${idx + 1}</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
      </div>
      ${idx === state.currentIndex ? '<span style="color: var(--gold);">&#9835;</span>' : ''}
    </div>
  `).join('');

  modal.classList.add('show');

  // Close on overlay click
  modal.onclick = (e) => {
    if (e.target === modal) modal.classList.remove('show');
  };
}

function playlistSelect(index) {
  document.getElementById('playlistModal').classList.remove('show');
  playFile(index);
}

// ============ Favorites ============
function toggleFavorite() {
  if (!state.currentFile) return;

  const url = state.currentFile.url;
  const idx = state.favorites.indexOf(url);

  if (idx > -1) {
    state.favorites.splice(idx, 1);
  } else {
    state.favorites.push(url);
  }

  localStorage.setItem('favs', JSON.stringify(state.favorites));
  updateFavButton();
  renderFavorites();
}

function updateFavButton() {
  if (!state.currentFile) return;
  const isFav = state.favorites.includes(state.currentFile.url);
  document.getElementById('favIcon').innerHTML = isFav ? '&#9829;' : '&#9825;';
  document.getElementById('favText').textContent = isFav ? 'تمت الإضافة للمفضلة' : 'أضف إلى المفضلة';
}

function renderFavorites() {
  const list = document.getElementById('favList');

  const favItems = [];
  state.surahs.forEach(surah => {
    surah.files.forEach(file => {
      if (state.favorites.includes(file.url)) {
        favItems.push({ surah: surah.name, file, fileIndex: surah.files.indexOf(file) });
      }
    });
  });

  if (favItems.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <h3>لا توجد مفضلة</h3>
        <p>أضف ملفات إلى المفضلة للوصول السريع</p>
      </div>
    `;
    return;
  }

  list.innerHTML = favItems.map((item, idx) => `
    <div class="file-item" onclick="playFromFav(${idx})">
      <div class="file-index">${idx + 1}</div>
      <div class="file-info">
        <div class="file-name">${item.file.name}</div>
        <div style="font-size: 11px; color: var(--gold); margin-top: 2px;">${item.surah}</div>
      </div>
      <button class="file-play-btn">&#9654;</button>
    </div>
  `).join('');

  // Store for playing
  state._favItems = favItems;
}

function playFromFav(index) {
  const items = state._favItems || [];
  if (index >= items.length) return;
  const item = items[index];
  const surah = state.surahs.find(s => s.name === item.surah);
  if (surah) {
    state.currentSurah = surah;
    document.getElementById('appBarTitle').textContent = surah.name;
    document.getElementById('page-home').classList.remove('active');
    document.getElementById('page-favorites').classList.remove('active');
    document.getElementById('page-surah').classList.add('active');
    renderSurahFiles();
    playFile(item.fileIndex);
  }
}

// ============ Navigation ============
function goHome() {
  document.getElementById('appBarTitle').textContent = 'القرآن الكريم';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-home').classList.add('active');
  state.currentSurah = null;
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');

  const titles = { home: 'القرآن الكريم', favorites: '&#9829; المفضلة', settings: '&#9881; الإعدادات' };
  document.getElementById('appBarTitle').innerHTML = titles[page] || 'القرآن الكريم';

  if (page === 'favorites') renderFavorites();
}

// ============ Search ============
function toggleSearch() {
  const container = document.getElementById('searchContainer');
  container.classList.toggle('show');
  if (container.classList.contains('show')) {
    document.getElementById('searchBox').focus();
  } else {
    document.getElementById('searchBox').value = '';
    state.searchQuery = '';
    renderSurahs();
  }
}

function handleSearch(value) {
  state.searchQuery = value;
  renderSurahs(value);
}

// ============ Dark Mode ============
function toggleDarkMode() {
  state.isDarkMode = !state.isDarkMode;
  document.body.classList.toggle('dark-mode', state.isDarkMode);
  document.getElementById('darkModeToggle').classList.toggle('active', state.isDarkMode);
  localStorage.setItem('darkMode', state.isDarkMode ? '1' : '0');
}

// Restore dark mode
if (localStorage.getItem('darkMode') === '1') {
  state.isDarkMode = true;
  document.body.classList.add('dark-mode');
  document.getElementById('darkModeToggle').classList.add('active');
}

// ============ Toast ============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============ Data URL Config ============
function showDataConfig() {
  const currentUrl = localStorage.getItem('data_url') || '';
  const url = prompt('أدخل رابط ملف data.json:', currentUrl);
  if (url) {
    localStorage.setItem('data_url', url);
    showToast('تم حفظ الرابط. سيتم تحميل البيانات عند إعادة التشغيل.');
  }
}

// ============ Start App ============
document.addEventListener('DOMContentLoaded', init);
</script>
